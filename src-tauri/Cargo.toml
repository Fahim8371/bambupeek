[package]
name = "bambupeek"
version = "0.1.0"
description = "A private desktop window onto your 3D printer"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
